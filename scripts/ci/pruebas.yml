# What GitHub does by itself with every proposed change and with every change that reaches `main`:
#
#   · checks the types, runs the unit tests and builds the site, which stops when it weighs more than it may;
#   · plays the built site in a real browser (the tests of `e2e/`);
#   · and, on `main`, with all of that passed, publishes the site it has just built on GitHub Pages.
#
# The last step only happens when the repository has "GitHub Actions" as the source of its Pages
# (Settings → Pages → Build and deployment → Source). While it says "Deploy from a branch", Pages goes on
# publishing the `docs` folder of `main`, as it always did, and this workflow only tests.
name: Pruebas y publicación

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a proposal leaves the run of the one before without a reason to finish. On `main` every
# run ends: each is a version that has to be tested and published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruebas:
    name: Tipos, pruebas y tamaño
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      publica: ${{ steps.pages.outputs.publica }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Tipos, sitio compilado y tamaño
        run: npm run build
      # Who publishes the site: this workflow ("workflow") or Pages itself from the `docs` folder ("legacy").
      - name: ¿Publica este flujo?
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tipo=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo desconocido)
          if [ "$tipo" = workflow ]; then
            echo "publica=si" >> "$GITHUB_OUTPUT"
          else
            echo "publica=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sin publicar desde aquí::GitHub Pages publica la carpeta docs de main (origen: $tipo). Para que lo haga este flujo: Settings → Pages → Source → GitHub Actions."
          fi
      - name: El sitio, para publicarlo
        if: steps.pages.outputs.publica == 'si'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  navegador:
    name: El juego en un navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas en el navegador
        run: npm run e2e
      # What a failed test leaves behind: its trace, to open with `npx playwright show-trace`.
      - name: Trazas de lo que ha fallado
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trazas
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  publicar:
    name: Publicar en GitHub Pages
    needs: [pruebas, navegador]
    if: needs.pruebas.outputs.publica == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v5
