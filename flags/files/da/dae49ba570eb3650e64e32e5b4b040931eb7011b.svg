<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#002080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3366ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradRight" x1="0%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3366ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002080;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#ffffff" />

  <polygon points="0,0 300,200 0,400" fill="url(#gradLeft)" />

  <polygon points="600,0 300,200 600,400" fill="url(#gradRight)" />
